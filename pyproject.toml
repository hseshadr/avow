[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "avow"
dynamic = ["version"]
description = "Sign arbitrary JSON evidence and verify it offline."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Harish Seshadri" }]
dependencies = [
  "click>=8,<9",
  "pydantic>=2.10,<3",
  "pynacl>=1.5,<2",
  "rfc8785>=0.1.4,<1",
  "typer>=0.16,<0.26",
]

[project.scripts]
avow = "avow.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "poethepoet>=0.37,<1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "xenon>=0.9.3,<1",
]

[tool.hatch.version]
path = "src/avow/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/avow"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/avow",
]
exclude = ["/ts/coverage", "/ts/node_modules"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S", "PL"]
ignore = ["N818", "RUF036"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"src/avow/__init__.py" = ["I001"]
"src/avow/envelope.py" = ["I001"]
"tests/test_envelope.py" = ["SIM300"]
"tests/**/*.py" = ["PLR2004", "S101", "S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["nacl.*", "rfc8785.*"]
ignore_missing_imports = true

[tool.poe.tasks]
lint = { shell = "ruff check --fix src tests scripts && ruff format src tests scripts" }
typecheck = "mypy --strict src scripts"
complexity = "xenon --max-absolute A --max-modules A --max-average A src scripts"
test = "pytest --cov=src --cov-branch --cov-fail-under=90"
gate = ["lint", "typecheck", "complexity", "test"]
workflow-contract = "pytest tests/test_workflow_contract.py -q"
workflow-lint = "actionlint"
workflow-security = "uvx zizmor==1.29.0 --persona=auditor --min-severity=low --offline --strict-collection .github"
secrets = { shell = "gitleaks git --redact --no-banner --log-opts=--all . && gitleaks dir --redact --no-banner ." }
audit-python = { shell = "uv export --frozen --all-groups --no-emit-project --format requirements.txt --output-file /tmp/avow-audit-requirements.txt >/dev/null && uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/avow-audit-requirements.txt --require-hashes --strict --disable-pip --progress-spinner off" }
audit-typescript = { shell = "pnpm --dir ts install --frozen-lockfile --ignore-scripts && pnpm --dir ts audit --audit-level high" }
audit = ["audit-python", "audit-typescript"]
artifacts = "bash scripts/build_release_artifacts.sh dist/release"
release-candidate = "bash scripts/verify_release_candidate.sh"
